# bbport settings (in-game menu: Insert / L3+R3)
# Overlay this onto BBPort 1.8.2. If you already have a bbport.ini, you can
# keep it and only add the four frame_gen lines at the bottom.
upscaler=dlss
preset=1
sharpen=1
sharpness=0.50
object_motion=1
show_fps=1
output_res=1920x1080
model_lod=0
live_resolution=auto
hud_position=100
effect_chromatic_aberration=1
effect_dof=1
effect_motion_blur=1
effect_ssao=1
effect_game_aa=1
effect_dynamic_shadows=1
effect_ssr=0
skip_intro=0
debug_camera=0
debug_menu=0
cheat_no_death=0
cheat_stealth=0
cheat_silent=0
cheat_rally_no_decay=0
cheat_enemy_control=0
tweak_no_rally=0
tweak_camera_distance=0
tweak_no_camera_rotation=0
tweak_easy_run=0
tweak_ragdoll=0
tweak_circle_confirm=0
quit_to_desktop=1
frame_gen=1
fg_backend=auto
fg_multiplier=2
fg_reflex=1
